services:
      
  frontend:
    build:
      context: https://github.com/MCorbalanF/aphroditapp.git#main:frontend
    container_name: aphroditapp_frontend
    restart: unless-stopped
    environment:
      EXPO_PUBLIC_API_URL: http://aprhoditapp.ddns.net:8000/api
      EXPO_PUBLIC_APP_NAME: Aphroditapp
      EXPO_PUBLIC_APP_VERSION: 1.0.0
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - aphroditapp_network
   
  api:
      build:
        context: https://github.com/MCorbalanF/aphroditapp.git#main:backend
        dockerfile: Dockerfile
      container_name: aphroditapp_api
      restart: unless-stopped
      environment:
        SECRET_KEY: django-insecure-y2wcye^hjy&3l1yif)9p!5_=!sistc7*)p$ar&nrh%w#%5rdrm
        DEBUG: false
        DB_NAME: db_aphroditapp
        DB_USER: admin_db_aphroditapp
        DB_PASSWORD: 4U?S7(e*aQ6*
        DB_HOST: aphroditapp_db
        DB_PORT: 5432
        FRONTEND_URL: http://localhost
      command: >
        sh -c "
          echo 'Esperando a que la base de datos esté lista...' &&
          while ! nc -z db 5432; do sleep 1; done &&
          echo 'Base de datos lista!' &&
          python manage.py makemigrations --noinput &&
          python manage.py migrate --noinput &&
          python manage.py collectstatic --noinput --clear &&
          gunicorn --bind 0.0.0.0:8001 --workers 3 --timeout 120 --access-logfile - --error-logfile - aphroditapp.wsgi:application
        "
      volumes:
        - ./backend:/app
      ports:
        - "${API_PORT:-8001}:8001"

      depends_on:
        db:
          condition: service_healthy
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8001/api/health/"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 40s
      networks:
        - aphroditapp_network
  

  db:
    image: postgres:15
    container_name: aphroditapp_db
    restart: always
    environment:
      POSTGRES_DB: db_aphroditapp
      POSTGRES_USER: admin_db_aphroditapp
      POSTGRES_PASSWORD: 4U?S7(e*aQ6*
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - aphroditapp_network

volumes:
  postgres_data:

networks:
  aphroditapp_network:
    driver: bridge
